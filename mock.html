<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BandWise — Mock Test</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0a0c10;--surface:#13161d;--surface2:#1a1e28;--border:#252a38;--gold:#d4a843;--gold-light:#f0c967;--text:#e8eaf0;--muted:#5a6278;--muted2:#8892a4;--green:#34d399;--red:#f87171;--blue:#60a5fa;}
body.light{--bg:#f7f6f2;--surface:#ffffff;--surface2:#eeede8;--border:#dedad2;--text:#1c1c1a;--muted:#a0998e;--muted2:#6e6b63;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;transition:background 0.2s,color 0.2s;}

/* SELECTION */
.mock-selection{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;}
.sel-top{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:900px;margin-bottom:3rem;}
.sel-logo{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:900;}
.logo-band{color:var(--text);}.logo-wise{color:var(--gold);font-style:italic;}
.btn-theme-sel{background:transparent;border:1px solid var(--border);color:var(--text);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;}
.btn-theme-sel:hover{border-color:var(--gold);}
.sel-header{text-align:center;margin-bottom:3rem;}
.sel-header h2{font-family:'Playfair Display',serif;font-size:2.4rem;font-weight:900;margin-bottom:0.5rem;}
.sel-header h2 em{color:var(--gold);font-style:italic;}
.sel-header p{color:var(--muted2);font-size:0.95rem;}
.mock-cards{display:flex;gap:1.5rem;flex-wrap:wrap;justify-content:center;max-width:900px;}
.mock-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2rem;width:260px;cursor:pointer;transition:all 0.25s;position:relative;overflow:hidden;text-align:left;}
.mock-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold-light));}
.mock-card:hover{border-color:rgba(212,168,67,0.45);transform:translateY(-5px);box-shadow:0 16px 48px rgba(0,0,0,0.35);}
.mock-card-num{font-family:'Playfair Display',serif;font-size:3.5rem;font-weight:900;color:rgba(212,168,67,0.12);line-height:1;margin-bottom:0.4rem;}
.mock-card-title{font-size:1.1rem;font-weight:700;margin-bottom:1rem;}
.mock-card-meta{display:flex;flex-direction:column;gap:0.4rem;margin-bottom:1.5rem;}
.mock-card-meta span{font-size:0.8rem;color:var(--muted2);}
.mock-card-btn{display:inline-flex;align-items:center;gap:0.4rem;background:linear-gradient(135deg,var(--gold),var(--gold-light));color:#0a0c10;padding:0.55rem 1.3rem;border-radius:8px;font-size:0.85rem;font-weight:700;}
.mock-card-soon{opacity:0.5;cursor:not-allowed;pointer-events:none;}
.mock-card-soon:hover{transform:none!important;box-shadow:none!important;border-color:var(--border)!important;}
.mock-card-soon-badge{display:inline-block;background:rgba(212,168,67,0.12);color:var(--gold);border:1px solid rgba(212,168,67,0.2);padding:0.4rem 1rem;border-radius:8px;font-size:0.82rem;font-weight:700;}
.back-link{margin-top:2.5rem;color:var(--muted2);font-size:0.85rem;cursor:pointer;text-decoration:none;display:block;text-align:center;}
.back-link:hover{color:var(--gold);}

/* INTRO */
.mock-intro{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;}
.intro-icon{font-size:3rem;margin-bottom:1rem;}
.mock-intro h2{font-family:'Playfair Display',serif;font-size:2rem;font-weight:900;margin-bottom:1.5rem;}
.intro-info{display:flex;gap:1.5rem;margin-bottom:2rem;flex-wrap:wrap;justify-content:center;}
.intro-block{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.2rem 2rem;min-width:200px;}
.intro-label{font-size:0.75rem;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.3rem;}
.intro-val{font-size:0.88rem;color:var(--muted2);}
.intro-rules{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem 2rem;max-width:500px;margin-bottom:2rem;text-align:left;}
.intro-rules p{font-size:0.85rem;color:var(--muted2);line-height:1.9;}
.btn-start-mock{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:#0a0c10;border:none;padding:0.9rem 2.5rem;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;transition:all 0.2s;display:block;margin:0 auto 0.8rem;}
.btn-start-mock:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(212,168,67,0.3);}
.btn-back-sel{background:transparent;border:1px solid var(--border);color:var(--muted2);padding:0.6rem 1.5rem;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:0.85rem;cursor:pointer;transition:all 0.2s;display:block;margin:0 auto;}
.btn-back-sel:hover{border-color:var(--muted2);color:var(--text);}

/* READING */
.mock-reading-wrap{display:flex;flex-direction:column;height:100vh;background:var(--bg);overflow:hidden;}
.mock-topbar{display:flex;align-items:center;justify-content:space-between;padding:0.6rem 1.2rem;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;gap:1rem;}
.mock-topbar-left{display:flex;align-items:center;gap:0.8rem;}
.mock-title{font-weight:700;font-size:0.88rem;}
.mock-phase-tag{background:rgba(96,165,250,0.12);color:var(--blue);border:1px solid rgba(96,165,250,0.2);padding:0.2rem 0.6rem;border-radius:6px;font-size:0.72rem;font-weight:700;}
.listening-tag{background:rgba(52,211,153,0.12);color:var(--green);border-color:rgba(52,211,153,0.2);}
.mock-timer{font-size:1.2rem;font-weight:700;color:var(--text);background:var(--surface2);border:1px solid var(--border);padding:0.3rem 0.9rem;border-radius:8px;min-width:80px;text-align:center;}
.mock-timer.timer-warning{color:var(--red);border-color:rgba(248,113,113,0.3);}
.mock-topbar-right{display:flex;align-items:center;gap:0.8rem;}
.highlight-tools{display:flex;align-items:center;gap:0.4rem;}
.hl-label{font-size:0.75rem;color:var(--muted2);}
.hl-btn{background:transparent;border:2px solid transparent;border-radius:6px;padding:0.2rem 0.4rem;cursor:pointer;font-size:1rem;transition:all 0.15s;}
.hl-btn:hover,.hl-btn.active{border-color:var(--gold);}
.hl-erase{font-size:0.8rem;color:var(--muted2);border:1px solid var(--border)!important;font-weight:700;padding:0.2rem 0.5rem;}
.font-controls{display:flex;align-items:center;gap:0.3rem;}
.font-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:0.25rem 0.65rem;border-radius:6px;font-family:'DM Sans',sans-serif;font-weight:700;cursor:pointer;font-size:0.82rem;transition:all 0.2s;}
.font-btn:hover{border-color:var(--gold);color:var(--gold);}
.btn-icon{background:transparent;border:1px solid var(--border);color:var(--text);padding:0.3rem 0.6rem;border-radius:6px;cursor:pointer;font-size:0.9rem;transition:all 0.2s;}
.btn-icon:hover{border-color:var(--gold);}

/* SPLIT */
.mock-split{display:flex;flex:1;overflow:hidden;min-height:0;}
.mock-passage-panel{width:50%;display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden;min-width:200px;}
.passage-nav-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;}
.ptab{flex:1;padding:0.65rem;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--muted2);font-family:'DM Sans',sans-serif;font-size:0.83rem;font-weight:600;cursor:pointer;transition:all 0.15s;}
.ptab:hover{color:var(--text);}.ptab.active{color:var(--gold);border-bottom-color:var(--gold);}
.passage-content{flex:1;overflow-y:auto;padding:1.5rem;}
.passage-title{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:700;margin-bottom:0.5rem;line-height:1.3;}
.passage-subtitle{font-size:0.83rem;color:var(--muted2);font-style:italic;margin-bottom:1rem;line-height:1.5;}
/* NO font-size on passage-text p — controlled by JS for A+/A- to work */
.passage-text p{line-height:1.85;margin-bottom:1rem;color:var(--text);}
.hl-span{cursor:text;border-radius:2px;}
.drag-handle{width:10px;background:var(--surface);border-left:1px solid var(--border);border-right:1px solid var(--border);cursor:col-resize;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.drag-handle:hover{background:var(--surface2);}
.drag-dots{color:var(--muted);font-size:0.9rem;letter-spacing:-2px;user-select:none;}
.mock-questions-panel{flex:1;overflow:hidden;display:flex;flex-direction:column;min-width:200px;}
.questions-scroll{flex:1;overflow-y:auto;padding:1.2rem;}

/* QUESTIONS */
.q-group{margin-bottom:1.8rem;}
.q-instructions{font-size:0.8rem;color:var(--gold);font-weight:600;background:rgba(212,168,67,0.06);border:1px solid rgba(212,168,67,0.15);border-radius:8px;padding:0.7rem 0.9rem;margin-bottom:1rem;line-height:1.5;}
.q-group-title{font-size:0.85rem;font-weight:700;margin-bottom:0.8rem;padding-bottom:0.4rem;border-bottom:1px solid var(--border);}
.q-item{display:flex;gap:0.7rem;margin-bottom:1rem;padding:0.7rem;border-radius:8px;border:1px solid var(--border);background:var(--surface);transition:border-color 0.15s;}
.q-item:hover{border-color:rgba(212,168,67,0.2);}
.q-item-inline{align-items:center;}
.q-num{font-size:0.75rem;font-weight:700;color:var(--gold);background:rgba(212,168,67,0.1);border:1px solid rgba(212,168,67,0.2);width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.q-content{flex:1;}
.q-text{font-size:0.83rem;line-height:1.6;margin-bottom:0.6rem;color:var(--text);}
.q-options-row{display:flex;gap:0.5rem;flex-wrap:wrap;}
.q-radio-label{display:flex;align-items:center;gap:0.4rem;background:var(--surface2);border:2px solid var(--border);border-radius:7px;padding:0.4rem 0.9rem;cursor:pointer;font-size:0.78rem;font-weight:600;transition:all 0.15s;user-select:none;}
.q-radio-label:hover{border-color:rgba(212,168,67,0.4);color:var(--gold);}
.q-radio-label.selected{background:rgba(212,168,67,0.12);border-color:var(--gold);color:var(--gold);}
.q-options{display:flex;flex-direction:column;gap:0.4rem;}
.q-option-label{display:flex;align-items:flex-start;gap:0.5rem;background:var(--surface2);border:2px solid var(--border);border-radius:7px;padding:0.5rem 0.8rem;cursor:pointer;font-size:0.8rem;line-height:1.5;transition:all 0.15s;user-select:none;}
.q-option-label:hover{border-color:rgba(212,168,67,0.4);}
.q-option-label.selected{background:rgba(212,168,67,0.12);border-color:var(--gold);}
.opt-key{font-weight:700;color:var(--gold);flex-shrink:0;background:rgba(212,168,67,0.1);width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:0.72rem;}
.q-select{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:0.45rem 0.7rem;font-family:'DM Sans',sans-serif;font-size:0.82rem;outline:none;cursor:pointer;margin-top:0.3rem;}
.q-select:focus{border-color:var(--gold);}
.q-input{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:0.35rem 0.6rem;font-family:'DM Sans',sans-serif;font-size:0.82rem;outline:none;min-width:130px;transition:border-color 0.15s;}
.q-input:focus{border-color:var(--gold);}
.word-list{display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:1rem;padding:0.8rem;background:var(--surface2);border-radius:8px;border:1px solid var(--border);}
.word-chip{font-size:0.78rem;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:0.25rem 0.6rem;}
.word-chip strong{color:var(--gold);}
.summary-text{font-size:0.85rem;line-height:2.4;color:var(--text);}
.q-select-inline{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:0.2rem 0.5rem;font-family:'DM Sans',sans-serif;font-size:0.8rem;outline:none;cursor:pointer;margin:0 0.2rem;}
.notes-section{margin-bottom:1rem;}
.notes-heading{font-size:0.82rem;font-weight:700;color:var(--blue);margin-bottom:0.6rem;padding:0.4rem 0.7rem;background:rgba(96,165,250,0.06);border-radius:6px;border-left:3px solid var(--blue);}
.q-item-form{flex-wrap:wrap;align-items:center;gap:0.4rem;}
.form-label{font-size:0.82rem;color:var(--muted2);min-width:150px;}
.form-prefix,.form-suffix{font-size:0.82rem;color:var(--muted2);}

/* ANSWER BOXES */
.mock-answer-boxes{display:flex;border-top:1px solid var(--border);background:var(--surface);flex-shrink:0;}
.answer-box-group{flex:1;padding:0.5rem 0.8rem;}
.answer-box-label{font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--gold);margin-bottom:0.4rem;}
.answer-box-nums{display:flex;flex-wrap:wrap;gap:3px;}
.answer-box{width:26px;height:26px;border-radius:5px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:700;cursor:pointer;color:var(--muted2);transition:all 0.15s;}
.answer-box:hover{border-color:var(--gold);color:var(--gold);}
.answer-box.answered{background:rgba(52,211,153,0.15);border-color:rgba(52,211,153,0.4);color:var(--green);}

/* BOTTOM NAV */
.mock-bottom-nav{display:flex;align-items:center;justify-content:space-between;padding:0.7rem 1.2rem;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;}
.passage-indicator{font-size:0.8rem;color:var(--muted2);}
.btn-nav{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:0.5rem 1.3rem;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:0.83rem;font-weight:600;cursor:pointer;transition:all 0.2s;}
.btn-nav:hover{border-color:var(--gold);color:var(--gold);}
.btn-nav-next{border-color:rgba(96,165,250,0.3);color:var(--blue);}
.btn-nav-finish{background:linear-gradient(135deg,var(--gold),var(--gold-light));border-color:transparent;color:#0a0c10;font-weight:700;}
.btn-nav-finish:hover{opacity:0.9;color:#0a0c10;}

/* CHOICE SCREEN */
.mock-choice-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;}
.choice-icon{font-size:3rem;margin-bottom:1rem;}
.mock-choice-screen h2{font-family:'Playfair Display',serif;font-size:2rem;font-weight:900;margin-bottom:0.5rem;}
.mock-choice-screen p{color:var(--muted2);font-size:0.9rem;margin-bottom:2rem;}
.choice-btns{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;}
.btn-choice{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:0.9rem 2rem;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:0.9rem;font-weight:600;cursor:pointer;transition:all 0.2s;}
.btn-choice:hover{border-color:var(--gold);color:var(--gold);}
.btn-continue-listening{background:linear-gradient(135deg,var(--gold),var(--gold-light));border-color:transparent;color:#0a0c10;font-weight:700;}
.btn-continue-listening:hover{opacity:0.9;color:#0a0c10;}

/* LISTENING */
.mock-listening-wrap{display:flex;flex-direction:column;height:100vh;background:var(--bg);overflow:hidden;}
.audio-player-bar{display:flex;align-items:center;gap:1rem;padding:0.8rem 1.5rem;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;}
.audio-note{font-size:0.78rem;color:var(--muted2);}
.listening-questions{flex:1;overflow-y:auto;padding:1.5rem;}
.listening-part{margin-bottom:2rem;}
.part-title{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;margin-bottom:0.4rem;}
.part-instructions{font-size:0.82rem;color:var(--muted2);margin-bottom:1rem;line-height:1.6;font-style:italic;}
.form-title-box{background:rgba(96,165,250,0.06);border:1px solid rgba(96,165,250,0.15);border-radius:8px;padding:0.7rem 1rem;font-size:0.85rem;font-weight:700;color:var(--blue);margin-bottom:1rem;text-align:center;}

/* RESULTS */
.mock-results-screen{max-width:800px;margin:0 auto;padding:2rem;}
.mock-results-screen h2{font-family:'Playfair Display',serif;font-size:2rem;font-weight:900;text-align:center;margin-bottom:2rem;}
.results-cards{display:flex;gap:1.5rem;justify-content:center;margin-bottom:2rem;flex-wrap:wrap;}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.5rem 2rem;text-align:center;min-width:180px;}
.result-card-label{font-size:0.75rem;color:var(--muted2);font-weight:700;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:0.5rem;}
.score-big{font-family:'Playfair Display',serif;font-size:3rem;font-weight:900;color:var(--gold);line-height:1;}
.score-big span{font-size:1.5rem;color:var(--muted2);}
.score-band{font-size:1rem;font-weight:700;margin-top:0.3rem;}
.results-table{display:flex;flex-direction:column;gap:0.3rem;margin-bottom:1rem;}
.result-row{display:flex;align-items:center;gap:0.8rem;padding:0.5rem 0.8rem;border-radius:7px;font-size:0.82rem;}
.result-row.correct{background:rgba(52,211,153,0.08);border:1px solid rgba(52,211,153,0.15);}
.result-row.wrong{background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.15);}
.result-num{width:28px;font-weight:700;color:var(--muted2);flex-shrink:0;}
.result-user{flex:1;color:var(--text);}
.result-arrow{font-weight:700;flex-shrink:0;}
.result-row.correct .result-arrow{color:var(--green);}
.result-row.wrong .result-arrow{color:var(--red);}
.result-correct{color:var(--green);font-weight:600;flex-shrink:0;}

::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--muted);}
</style>
</head>
<body>
<div id="mock-main"></div>
<script src="mock-data.js"></script>
<script src="mock-logic.js"></script>

</body>
</html>
