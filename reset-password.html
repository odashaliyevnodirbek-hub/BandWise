<!DOCTYPE html>
<!-- saved from url=(0055)file:///C:/Users/Nodirbek/Downloads/reset-password.html -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BandWise — Reset Password</title>
<link href="./reset-password_files/css2" rel="stylesheet">
<script src="./reset-password_files/supabase-js@2"></script>
<style>
  :root {
    --bg:#0a0c10; --surface:#13161d; --surface2:#1a1e28;
    --border:#252a38; --gold:#d4a843; --gold-light:#f0c967;
    --text:#e8eaf0; --muted:#5a6278; --muted2:#8892a4;
    --green:#34d399; --red:#f87171;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; }

  .box { width:100%; max-width:420px; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:2.5rem; position:relative; }
  .box::before { content:''; position:absolute; top:-100px; left:50%; transform:translateX(-50%); width:400px; height:300px; background:radial-gradient(ellipse,rgba(212,168,67,0.08) 0%,transparent 65%); pointer-events:none; }

  .logo { font-family:'Playfair Display',serif; font-size:1.4rem; font-weight:900; margin-bottom:2rem; text-align:center; }
  .logo-band { color:var(--text); }
  .logo-wise { color:var(--gold); font-style:italic; }

  h1 { font-family:'Playfair Display',serif; font-size:1.6rem; font-weight:900; margin-bottom:0.4rem; }
  h1 em { color:var(--gold); font-style:italic; }
  .subtitle { color:var(--muted2); font-size:0.85rem; margin-bottom:2rem; }

  .form-group { margin-bottom:1.1rem; }
  .form-label { display:block; font-size:0.8rem; font-weight:600; color:var(--muted2); margin-bottom:0.4rem; letter-spacing:0.04em; text-transform:uppercase; }
  .form-input { width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:0.75rem 1rem; color:var(--text); font-family:'DM Sans',sans-serif; font-size:0.9rem; outline:none; transition:border-color 0.2s; }
  .form-input:focus { border-color:var(--gold); }
  .form-input::placeholder { color:var(--muted); }

  .alert { border-radius:8px; padding:0.7rem 0.9rem; font-size:0.82rem; margin-bottom:1rem; display:none; }
  .alert.show { display:block; }
  .alert.error { background:rgba(248,113,113,0.1); border:1px solid rgba(248,113,113,0.3); color:var(--red); }
  .alert.success { background:rgba(52,211,153,0.1); border:1px solid rgba(52,211,153,0.3); color:var(--green); }

  .password-strength { margin-top:0.4rem; }
  .strength-bar { display:flex; gap:3px; margin-bottom:0.3rem; }
  .strength-seg { flex:1; height:3px; border-radius:2px; background:var(--border); transition:background 0.3s; }
  .strength-seg.weak { background:var(--red); }
  .strength-seg.medium { background:var(--gold); }
  .strength-seg.strong { background:var(--green); }
  .strength-label { font-size:0.72rem; color:var(--muted2); }

  .btn { width:100%; padding:0.85rem; background:linear-gradient(135deg,var(--gold),var(--gold-light)); color:#0a0c10; border:none; border-radius:9px; font-family:'DM Sans',sans-serif; font-size:0.95rem; font-weight:700; cursor:pointer; transition:all 0.2s; }
  .btn:hover { transform:translateY(-1px); box-shadow:0 8px 24px rgba(212,168,67,0.3); }
  .btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn.loading { pointer-events:none; }
  .btn.loading::after { content:''; display:inline-block; width:14px; height:14px; border:2px solid rgba(0,0,0,0.3); border-top-color:#0a0c10; border-radius:50%; animation:spin 0.6s linear infinite; margin-left:0.5rem; vertical-align:middle; }
  @keyframes spin { to{ transform:rotate(360deg); } }

  .back-link { text-align:center; margin-top:1.2rem; font-size:0.82rem; color:var(--muted2); }
  .back-link a { color:var(--gold); text-decoration:none; font-weight:600; }
</style>
</head>
<body>

<div class="box">
  <div class="logo">
    <span class="logo-band">Band</span><span class="logo-wise">Wise</span>
  </div>

  <div id="resetForm">
    <h1>Set New <em>Password</em></h1>
    <div class="subtitle">Choose a strong password for your account.</div>

    <div class="alert" id="alert"></div>

    <div class="form-group">
      <label class="form-label">New Password</label>
      <input type="password" class="form-input" id="newPassword" placeholder="Create a strong password" oninput="checkStrength(this.value)">
      <div class="password-strength">
        <div class="strength-bar">
          <div class="strength-seg" id="s1"></div>
          <div class="strength-seg" id="s2"></div>
          <div class="strength-seg" id="s3"></div>
          <div class="strength-seg" id="s4"></div>
        </div>
        <div class="strength-label" id="strengthLabel">Enter a password</div>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Confirm Password</label>
      <input type="password" class="form-input" id="confirmPassword" placeholder="Repeat your password">
    </div>

    <button class="btn" id="resetBtn" onclick="handleReset()">Update Password</button>

    <div class="back-link"><a href="file:///C:/Users/Nodirbek/Downloads/login.html">← Back to Login</a></div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://xiyeuhchpllqlwmlkcma.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_x3yErNcERzTk66ksbsBGEg_5AFfbeAz';
  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

  function showAlert(msg, type) {
    const el = document.getElementById('alert');
    el.textContent = msg;
    el.className = `alert show ${type}`;
  }

  function checkStrength(val) {
    const segs = ['s1','s2','s3','s4'].map(id => document.getElementById(id));
    const lbl = document.getElementById('strengthLabel');
    segs.forEach(s => s.className = 'strength-seg');
    if (!val) { lbl.textContent = 'Enter a password'; return; }
    let score = 0;
    if (val.length >= 8) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    const cls = score <= 1 ? 'weak' : score <= 2 ? 'medium' : 'strong';
    for (let i = 0; i < score; i++) segs[i].classList.add(cls);
    lbl.textContent = { weak:'Weak', medium:'Medium', strong:'Strong' }[cls];
    lbl.style.color = cls==='weak' ? 'var(--red)' : cls==='medium' ? 'var(--gold)' : 'var(--green)';
  }

  async function handleReset() {
    const pass    = document.getElementById('newPassword').value;
    const confirm = document.getElementById('confirmPassword').value;

    if (!pass || pass.length < 8) { showAlert('Password must be at least 8 characters.', 'error'); return; }
    if (pass !== confirm)          { showAlert('Passwords do not match.', 'error'); return; }

    const btn = document.getElementById('resetBtn');
    btn.textContent = 'Updating…'; btn.classList.add('loading'); btn.disabled = true;

    const { error } = await sb.auth.updateUser({ password: pass });

    btn.classList.remove('loading'); btn.disabled = false; btn.textContent = 'Update Password';

    if (error) { showAlert(error.message, 'error'); return; }

    showAlert('✅ Password updated! Redirecting to dashboard…', 'success');
    setTimeout(() => location.href = 'dashboard.html', 2000);
  }
</script>


</body></html>
